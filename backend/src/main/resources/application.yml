spring:
  application:
    name: pokehub
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names:
      - pokemon-references
      - pokemon-summaries
      - pokemon-details
      - evolution-chains
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=6h

pokehub:
  pokeapi:
    base-url: https://pokeapi.co/api/v2
    connect-timeout: 3s
    read-timeout: 5s
    max-concurrent-requests: 10
  jwt:
    secret: ${POKEHUB_JWT_SECRET}
    ttl: 1h
  cors:
    allowed-origins:
      - http://localhost:5173
  demo-user:
    enabled: true
    username: ash
    password: Pikachu#2026

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
